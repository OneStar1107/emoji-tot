<!doctype html>
<html lang="zh-CN" data-mono="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EmojiBot — 一个两位数，一个会表达的角色</title>
<meta name="description" content="71 个角色、3 种画法、18 种颜色、7 套主题，全部由一个两位数 emotionId 驱动。可调参数、复制代码、直接接入。" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<header class="bar">
  <a class="brand" href="#/console">
    <aora-bot shape="circle" color="black" size="30" state="idle" paused></aora-bot>
    <span>EmojiBot</span>
  </a>
  <nav class="nav" id="nav">
    <a href="#/console" data-route="console">控制台</a>
    <a href="#/gallery" data-route="gallery">表情馆</a>
    <a href="#/themes" data-route="themes">主题</a>
    <a href="#/docs" data-route="docs">文档</a>
  </nav>
  <div class="bar-right">
    <label class="switch">
      <input type="checkbox" id="mono" />
      <span>深色背景</span>
    </label>
  </div>
</header>

<main id="view"></main>

<footer>
  <span>Powered by <a href="https://github.com/sam70361/aora-bot">Aora Bot</a> ·
  表情语义来自 <a href="https://github.com/Aithena/emotion-ball">Emotion Ball</a> ·
  非商业衍生作品，见 NOTICE.md</span>
</footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
