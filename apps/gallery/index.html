<!doctype html>
<html lang="zh-CN" data-mono="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EmojiBot — 一个两位数，一个会表达的角色</title>
<meta name="description" content="71 cast members, 3 style series, 18 colours, 7 themes — driven by a two-digit emotionId. Tune it, copy the snippet, ship it." />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<header class="bar">
  <a class="brand" href="#/console">
    <emojibot-ball shape="circle" color="white" size="30" state="idle"></emojibot-ball>
    <span>EmojiBot</span>
  </a>
  <nav class="nav" id="nav">
    <a href="#/console" data-route="console" data-i18n="nav.console">控制台</a>
    <a href="#/gallery" data-route="gallery" data-i18n="nav.gallery">表情馆</a>
    <a href="#/scene" data-route="scene" data-i18n="nav.scene">场景</a>
    <a href="#/docs" data-route="docs" data-i18n="nav.docs">文档</a>
  </nav>
  <div class="bar-right">
    <div class="group" id="lang">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <label class="switch">
      <input type="checkbox" id="mono" />
      <span data-i18n="nav.dark">深色背景</span>
    </label>
  </div>
</header>

<main id="view"></main>

<footer>
  <span><span data-i18n="footer.license">MIT 许可 · 由 @emojibot/core 绘制</span> ·
  <a href="https://github.com/OneStar1107/emoji-bot/blob/main/NOTICE.md">NOTICE</a></span>
</footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
