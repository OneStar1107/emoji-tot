<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    The app icon, drawn instead of traced.
    The previous PNG was a low-resolution export: its rounded corners and the
    ring inside were visibly stepped at 512px and worse at 16px in the tray.
    A vector master plus sharp's renderer gives clean edges at every size.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="0.45" stop-color="#151518"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="6" y="6" width="500" height="500" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="116" fill="url(#glow)"/>
  <rect x="7.5" y="7.5" width="497" height="497" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <circle cx="256" cy="256" r="170" fill="none" stroke="#fafafa" stroke-width="17"/>
  <circle cx="256" cy="256" r="150" fill="#0d0d0f"/>

  <rect x="196" y="220" width="33" height="54" rx="16.5" fill="#fafafa"/>
  <rect x="283" y="220" width="33" height="54" rx="16.5" fill="#fafafa"/>

  <ellipse cx="180" cy="304" rx="24" ry="12" fill="#8a8a92" fill-opacity="0.45"/>
  <ellipse cx="332" cy="304" rx="24" ry="12" fill="#8a8a92" fill-opacity="0.45"/>

  <path d="M222 318 q 17 -20 34 0 q 17 20 34 0" fill="none" stroke="#fafafa" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
