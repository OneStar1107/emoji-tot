<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="light" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
<title>EmojiBot</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="pet">
    <emojibot-ball cast="bot" size="120" state="idle"></emojibot-ball>
  </div>
  <div id="bubble" role="status" aria-live="polite"></div>

  <!-- Both modules; renderer.js waits for the element to be defined rather
       than assuming script order. -->
  <script type="module" src="./vendor/core/element.js"></script>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
