<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self' data:" />
<title>EmojiTot Island</title>
<link rel="stylesheet" href="./island.css" />
<link rel="stylesheet" href="./polar-graphite.css" />
<link rel="stylesheet" href="./polar-graphite-parity.css" />
</head>
<body>
  <div id="island" data-open="false">
    <div id="frame">
    <!-- Collapsed: one pill. The face is the character; the rest is status. -->
    <button class="pill" id="pill" type="button" aria-expanded="false" aria-label="展开 EmojiTot">
      <!-- Frost is a layered CSS surface; nothing is captured or filtered. -->
      <span class="pill-face"><emojitot-ball cast="tot" size="24" state="idle" live></emojitot-ball></span>
      <span class="pill-status" id="pill-status"></span>
    </button>
    <button class="paused-resume" id="paused-resume" type="button" hidden aria-label="继续播放">
      <img id="paused-resume-art" alt="" hidden />
      <span class="paused-resume__play" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
      </span>
    </button>

    <!-- Expanded: header, one page, dots. -->
    <section class="panel pgm-island" id="panel" hidden aria-label="EmojiTot 面板">
      <!-- The page and its chrome, as one layer the fold clips against the
           card's animated box (see paintMorph in island.js). The paging
           arrows stay outside: they are chrome that scales with the surface. -->
      <div class="panel-body" id="panel-body">
      <header class="pgm-island-head">
        <span class="top-face pgm-cast-slot" aria-hidden="true">
          <emojitot-ball cast="tot" size="32" state="idle" live></emojitot-ball>
        </span>
        <span class="pgm-island-title">
          <b id="page-name">媒体</b>
          <span id="page-sub">系统正在播放</span>
        </span>
        <span id="top-clock" class="top-clock pgm-island-meta">--:--</span>
        <span id="top-battery" class="top-battery pgm-island-meta pgm-battery" hidden></span>
        <button type="button" class="icon-btn pgm-gear" id="btn-settings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.05V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.4.44.73.85.94.27.13.57.2.87.2H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        </button>
      </header>
      <main class="pages pgm-island-body" id="pages"></main>
      <footer class="island-footer pgm-island-foot">
        <button type="button" class="pager prev pgm-page-btn" data-page-nav="-1" aria-label="上一页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span>上一页</span>
        </button>
        <span class="pgm-pager page-center">
          <span class="pgm-pips dots" id="dots" aria-hidden="true"></span>
          <span class="pgm-page-count page-count" id="page-count">01 / 11</span>
        </span>
        <button type="button" class="pager next pgm-page-btn" data-page-nav="1" aria-label="下一页">
          <span>下一页</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </footer>
      </div>
    </section>
    <!-- Auto-avoid: the pill collapses to this strip while a listed app covers it. -->
    <div id="avoid-strip" aria-hidden="true"></div>
    </div>
  </div>

  <script type="module" src="./vendor/core/element.js"></script>
  <script type="module" src="./island.js"></script>
</body>
</html>
