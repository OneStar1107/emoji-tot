<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EmojiBot Studio — 发一个 id，角色就动</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<main>
  <section class="stage">
    <div class="ball">
      <aora-bot shape="circle" color="black" size="240" state="idle"></aora-bot>
      <p class="caption" id="caption"></p>
    </div>
  </section>

  <section class="panel">
    <div class="row">
      <label for="wire">发一条消息</label>
      <input id="wire" autocomplete="off" spellcheck="false"
             placeholder='{"emotionId":"34","tips":"读取失败"}' />
    </div>

    <div class="row" id="presets" aria-label="常用状态"></div>

    <div class="row">
      <label for="style">画法</label>
      <select id="style">
        <option value="vector">vector</option>
        <option value="pixel">pixel</option>
        <option value="kaomoji">kaomoji</option>
      </select>
      <select id="variant"></select>
    </div>

    <div class="row">
      <label for="mono">配色</label>
      <label class="switch">
        <input type="checkbox" id="mono" />
        <span>反色 · 钉死明暗</span>
      </label>
    </div>

    <pre class="log" id="log" aria-live="polite"></pre>
  </section>
</main>

<footer>
  Powered by <a href="https://github.com/sam70361/aora-bot">Aora Bot</a> ·
  表情语义来自 <a href="https://github.com/Aithena/emotion-ball">Emotion Ball</a> ·
  本项目为非商业衍生作品，见 NOTICE.md
</footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
