name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install / typecheck / test / build / preview / scan
    runs-on: ubuntu-latest
    env:
      # The desktop app is never launched here; skipping the Electron binary
      # download keeps the job on the build-time dependencies only.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The privacy scan reads commit author addresses out of history, so a
          # shallow clone would silently weaken it.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # No `version:` on purpose: action-setup reads it from package.json's
        # packageManager field, and specifying both makes it refuse to start
        # with "Multiple versions of pnpm specified".

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Build before Test on purpose: the desktop tests import
      # @emojitot/protocol, whose entry point is packages/protocol/dist/index.js.
      # Running the tests on a fresh checkout with no dist fails to resolve it.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Preview
        run: pnpm preview

      - name: Gallery production build
        run: pnpm --filter @emojitot/gallery build

      - name: Gallery browser acceptance
        env:
          CHROME_REQUIRED: '1'
        run: node apps/gallery/scripts/browser-check.mjs

      - name: Docs match the code
        run: pnpm docs:check

      - name: Settings audit matches the code
        run: pnpm settings:check

      - name: Privacy scan
        run: pnpm scan

      - name: Dependency audit
        run: pnpm audit:ci

      - name: Upload preview wall
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-wall
          path: out/preview.html
          if-no-files-found: warn

  desktop-smoke:
    name: desktop smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Same as the verify job: no `version:` here, or action-setup refuses to
        # start with "Multiple versions of pnpm specified" against packageManager.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm build

      # `allowBuilds` in pnpm-workspace.yaml lets electron's install script run,
      # but a replayed install can still leave node_modules/electron/dist empty
      # on a cold runner, which the smoke test reports as "Electron binary is
      # missing". Rebuilding the one package forces the download.
      - name: Electron binary
        run: pnpm rebuild electron

      - name: Desktop window smoke
        run: pnpm smoke:desktop
