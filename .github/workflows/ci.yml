name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install / typecheck / test / build / preview / scan
    runs-on: ubuntu-latest
    env:
      # The desktop app is never launched here; skipping the Electron binary
      # download keeps the job on the build-time dependencies only.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The privacy scan reads commit author addresses out of history, so a
          # shallow clone would silently weaken it.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Preview
        run: pnpm preview

      - name: Docs match the code
        run: pnpm docs:check

      - name: Settings audit matches the code
        run: pnpm settings:check

      - name: Privacy scan
        run: pnpm scan

      - name: Upload preview wall
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-wall
          path: out/preview.html
          if-no-files-found: warn
