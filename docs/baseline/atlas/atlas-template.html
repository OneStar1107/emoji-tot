<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目地图工作台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --ink-soft: #33404d;
      --muted: #5b646f;
      --paper: #fbfaf6;
      --canvas: #f1eee6;
      --canvas-deep: #e8e4da;
      --rule: #d4d0c5;
      --rule-strong: #a9a69d;
      --blue: #2456d8;
      --blue-soft: #e3eaff;
      --sidebar: #17212b;
      --sidebar-soft: #25313d;
      --amber: #96450b;
      --amber-soft: #fff0d8;
      --green: #1f7658;
      --green-soft: #def2ea;
      --red: #ad3636;
      --red-soft: #fbe7e5;
      --violet: #6650a4;
      --violet-soft: #ede8fb;
      --shadow: 0 18px 45px rgba(23, 33, 43, 0.09);
      --radius: 14px;
      --board-zoom: 1;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      background: var(--canvas);
      scroll-behavior: smooth;
    }

    body {
      min-width: 0;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 33, 43, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 43, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 24px 24px;
      font-family: "Aptos", "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    button,
    input,
    select,
    summary {
      font: inherit;
    }

    button,
    select,
    input {
      border: 1px solid var(--rule-strong);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
    }

    button {
      min-height: 44px;
      padding: 9px 14px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--blue);
    }

    button:active {
      transform: translateY(1px);
    }

    :focus-visible {
      outline: 3px solid rgba(36, 86, 216, 0.38);
      outline-offset: 3px;
    }

    a {
      color: var(--blue);
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3,
    .display-type {
      font-family: "Bahnschrift", "Aptos Display", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      letter-spacing: -0.02em;
    }

    h1 {
      margin-bottom: 7px;
      font-size: clamp(27px, 3vw, 43px);
      line-height: 1.12;
    }

    h2 {
      margin-bottom: 6px;
      font-size: clamp(21px, 2vw, 28px);
      line-height: 1.2;
    }

    h3 {
      margin-bottom: 5px;
      font-size: 18px;
      line-height: 1.25;
    }

    p {
      color: var(--ink-soft);
    }

    .skip-link {
      position: fixed;
      z-index: 1000;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      background: var(--paper);
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .app-shell {
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow: auto;
      color: #f8fafc;
      background:
        radial-gradient(circle at 18% 4%, rgba(73, 119, 221, 0.3), transparent 30%),
        var(--sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar-brand {
      padding: 27px 24px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-bottom: 14px;
      color: var(--sidebar);
      background: #f0d4a9;
      border-radius: 10px 10px 10px 3px;
      font-family: "Bahnschrift", sans-serif;
      font-size: 19px;
      font-weight: 700;
    }

    .sidebar-brand h1 {
      margin: 0 0 8px;
      color: #fff;
      font-size: 21px;
      line-height: 1.28;
      letter-spacing: -0.01em;
    }

    .sidebar-brand p {
      margin: 0;
      color: #b8c1ca;
      font-size: 13px;
      line-height: 1.5;
    }

    .coverage-box {
      margin: 18px 18px 8px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 11px;
    }

    .coverage-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
      color: #e8edf2;
      font-size: 12px;
    }

    .coverage-number {
      color: #fff;
      font-family: "Bahnschrift", sans-serif;
      font-size: 24px;
      line-height: 1;
    }

    .coverage-track {
      height: 6px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 3px;
    }

    .coverage-fill {
      height: 100%;
      background: #f0d4a9;
    }

    .nav-label {
      margin: 18px 24px 8px;
      color: #94a2af;
      font-size: 12px;
    }

    .view-nav {
      display: grid;
      gap: 3px;
      padding: 0 12px 14px;
    }

    .nav-button {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 46px;
      padding: 8px 10px;
      color: #c7d0d8;
      text-align: left;
      background: transparent;
      border-color: transparent;
      border-radius: 8px;
    }

    .nav-button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .nav-button[aria-selected="true"] {
      color: var(--sidebar);
      background: #f8f5ed;
      border-color: #f8f5ed;
    }

    .nav-icon {
      font-family: "Bahnschrift", sans-serif;
      font-size: 13px;
      text-align: center;
    }

    .nav-count {
      min-width: 25px;
      padding: 1px 7px;
      font-size: 12px;
      text-align: center;
      border: 1px solid currentColor;
      border-radius: 99px;
      opacity: 0.72;
    }

    .sidebar-tools {
      margin-top: auto;
      padding: 17px 18px 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-tools p {
      margin-bottom: 10px;
      color: #aeb9c2;
      font-size: 12px;
    }

    .zoom-tools {
      display: flex;
      gap: 6px;
    }

    .zoom-tools button {
      flex: 1;
      min-width: 44px;
      padding-inline: 8px;
      color: #eef2f5;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.17);
    }

    .main-shell {
      min-width: 0;
      padding: 28px clamp(18px, 3.5vw, 52px) 64px;
    }

    .main-shell-inner {
      width: min(1600px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--rule);
    }

    .breadcrumb {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .top-actions .primary {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .view-content {
      padding-top: 24px;
    }

    .view-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 20px;
    }

    .view-heading p {
      max-width: 760px;
      margin-bottom: 0;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 650;
    }

    .pill-row,
    .button-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill,
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 27px;
      padding: 3px 9px;
      color: var(--ink-soft);
      background: #f1efe8;
      border: 1px solid var(--rule);
      border-radius: 99px;
      font-size: 12px;
      line-height: 1.3;
      white-space: normal;
    }

    .status::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      content: "";
      background: currentColor;
      border-radius: 50%;
    }

    .status-confirmed,
    .status-retained,
    .status-accepted {
      color: var(--green);
      background: var(--green-soft);
      border-color: #b9ddcf;
    }

    .status-in_progress,
    .status-moved,
    .status-pending,
    .status-development {
      color: var(--amber);
      background: var(--amber-soft);
      border-color: #efd1a5;
    }

    .status-unverified,
    .status-missing,
    .status-verification {
      color: var(--red);
      background: var(--red-soft);
      border-color: #efc3be;
    }

    .status-experimental,
    .status-prototype,
    .status-added {
      color: var(--violet);
      background: var(--violet-soft);
      border-color: #d4c9f0;
    }

    .status-deprecated,
    .status-removed {
      color: var(--muted);
      background: #ebe9e4;
      border-color: #c8c4ba;
    }

    .section {
      margin-bottom: 24px;
    }

    .panel,
    .feature-card,
    .page-card,
    .change-card,
    .handoff-card {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: clamp(16px, 2vw, 25px);
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 17px;
    }

    .panel-header p {
      margin-bottom: 0;
    }

    .summary-grid,
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-width: 0;
      padding: 15px;
      background: #f4f1ea;
      border: 1px solid var(--rule);
      border-radius: 10px;
    }

    .metric strong {
      display: block;
      margin-bottom: 3px;
      font-family: "Bahnschrift", "Aptos Display", sans-serif;
      font-size: 29px;
      line-height: 1.1;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    .stage-line {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      margin: 18px 0 2px;
    }

    .stage-step {
      position: relative;
      min-width: 0;
      padding: 11px 8px 10px;
      color: var(--muted);
      text-align: center;
      background: #f1eee7;
      border: 1px solid var(--rule);
      border-radius: 8px;
      font-size: 12px;
    }

    .stage-step.current {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
      font-weight: 700;
    }

    .stage-step.done {
      color: var(--green);
      background: var(--green-soft);
      border-color: #b8dacb;
    }

    .two-column {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 18px;
      align-items: start;
    }

    .list-reset {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .attention-list,
    .flow-list,
    .annotation-list,
    .resource-list {
      display: grid;
      gap: 10px;
    }

    .attention-item,
    .flow-item,
    .annotation-item,
    .resource-item {
      min-width: 0;
      padding: 12px 13px;
      background: #f6f3ec;
      border: 1px solid var(--rule);
      border-radius: 9px;
    }

    .attention-item strong,
    .flow-item strong,
    .annotation-item strong,
    .resource-item strong {
      display: block;
      margin-bottom: 3px;
      overflow-wrap: anywhere;
    }

    .attention-item p,
    .flow-item p,
    .annotation-item p,
    .resource-item p {
      margin: 0;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .module-card {
      min-width: 0;
      padding: 15px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-top: 4px solid var(--blue);
      border-radius: 9px;
    }

    .module-card p {
      margin: 8px 0 13px;
      font-size: 13px;
    }

    .module-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 18px;
      padding: 14px;
      background: #e9e5dc;
      border: 1px solid var(--rule);
      border-radius: 10px;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: min(100%, 205px);
      flex: 1 1 205px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 44px;
      padding: 9px 11px;
    }

    .result-note {
      flex: 0 0 auto;
      padding-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .module-section {
      margin-bottom: 22px;
    }

    .module-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .module-heading p {
      margin: 0;
      font-size: 13px;
    }

    .page-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .page-card {
      display: grid;
      gap: 14px;
      padding: 17px;
      box-shadow: none;
    }

    .page-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .page-route {
      display: inline-block;
      max-width: 100%;
      margin-top: 5px;
      padding: 3px 7px;
      color: var(--ink-soft);
      background: #ece9e1;
      border-radius: 5px;
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .page-summary {
      margin: 0;
      font-size: 14px;
    }

    .state-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .state-card {
      min-width: 0;
      padding: 10px;
      background: #f5f2eb;
      border: 1px solid var(--rule);
      border-radius: 8px;
    }

    .state-card strong {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .structural-preview {
      position: relative;
      display: grid;
      gap: 5px;
      min-height: 102px;
      padding: 9px;
      background: #fff;
      border: 1px solid #c9c6bd;
      border-radius: 6px;
    }

    .preview-bar,
    .preview-line,
    .preview-block {
      min-width: 0;
      background: #dfe5f1;
      border-radius: 3px;
    }

    .preview-bar {
      width: 58%;
      height: 7px;
    }

    .preview-line {
      width: 100%;
      height: 4px;
      background: #e6e8eb;
    }

    .preview-block {
      min-height: 29px;
      background:
        repeating-linear-gradient(
          to bottom,
          #e7e9ed 0,
          #e7e9ed 3px,
          transparent 3px,
          transparent 9px
        );
      border: 1px solid #e0e2e6;
    }

    .structural-preview.after {
      border-color: #92acec;
      box-shadow: inset 0 0 0 2px #e8eeff;
    }

    .structural-preview.after .preview-bar {
      background: var(--blue);
    }

    .structural-preview.after .preview-block {
      background:
        repeating-linear-gradient(
          to bottom,
          #dfe6f8 0,
          #dfe6f8 3px,
          transparent 3px,
          transparent 9px
        ),
        #f7f9ff;
    }

    .preview-caption {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .page-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .micro-label {
      color: var(--muted);
      font-size: 11px;
    }

    .feature-card {
      padding: 18px;
      box-shadow: none;
    }

    .feature-list {
      display: grid;
      gap: 12px;
    }

    .feature-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .feature-title {
      min-width: 0;
    }

    .feature-title h3 {
      overflow-wrap: anywhere;
    }

    .feature-contract {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
      margin: 0;
    }

    .contract-row {
      min-width: 0;
      padding-top: 9px;
      border-top: 1px solid var(--rule);
    }

    .contract-row dt {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .contract-row dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .feature-evidence {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 9px;
      margin-top: 14px;
      padding: 10px 11px;
      background: #eeece6;
      border-radius: 7px;
      font-size: 13px;
    }

    .dependency-map {
      display: grid;
      gap: 10px;
    }

    .dependency-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(44px, 74px) minmax(0, 1fr) minmax(160px, 0.8fr);
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #f4f1ea;
      border: 1px solid var(--rule);
      border-radius: 9px;
    }

    .dependency-node {
      min-width: 0;
      padding: 9px 10px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 7px;
      overflow-wrap: anywhere;
    }

    .dependency-node small {
      display: block;
      color: var(--muted);
    }

    .dependency-arrow {
      color: var(--blue);
      font-family: "Bahnschrift", sans-serif;
      font-size: 13px;
      text-align: center;
    }

    .dependency-description {
      min-width: 0;
      color: var(--ink-soft);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .changes-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .change-card {
      padding: 17px;
      box-shadow: none;
    }

    .change-card h3 {
      margin-top: 12px;
    }

    .change-block {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--rule);
    }

    .change-block strong {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .change-block p {
      margin: 0;
      font-size: 14px;
    }

    .comparison-block {
      margin-bottom: 24px;
      padding: clamp(15px, 2vw, 23px);
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .comparison-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 15px;
    }

    .comparison-head p {
      margin-bottom: 0;
    }

    .segmented {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 4px;
      background: #e9e6df;
      border-radius: 10px;
    }

    .segmented button {
      min-height: 44px;
      padding: 7px 11px;
      background: transparent;
      border-color: transparent;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--paper);
      border-color: var(--rule);
      font-weight: 700;
    }

    .comparison-layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .comparison-block[data-mode="before"] .after-pane,
    .comparison-block[data-mode="after"] .before-pane {
      display: none;
    }

    .comparison-block[data-mode="before"] .comparison-layout,
    .comparison-block[data-mode="after"] .comparison-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .compare-pane {
      min-width: 0;
      padding: 13px;
      background: #f3f0e9;
      border: 1px solid var(--rule);
      border-radius: 10px;
    }

    .pane-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .compare-canvas {
      position: relative;
      min-height: 330px;
      padding: clamp(14px, 2.5vw, 26px);
      overflow: hidden;
      background:
        linear-gradient(rgba(23, 33, 43, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 43, 0.035) 1px, transparent 1px),
        #fff;
      background-size: 17px 17px;
      border: 1px solid #c9c6bd;
      border-radius: 8px;
    }

    .mock-window {
      min-height: 280px;
      padding: 16px;
      background: #fff;
      border: 1px solid #bfc3ca;
      border-radius: 11px;
      box-shadow: 0 10px 25px rgba(23, 33, 43, 0.08);
    }

    .mock-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 40px;
      margin-bottom: 14px;
      padding-bottom: 11px;
      border-bottom: 1px solid #e0e1e4;
    }

    .mock-titlebar strong {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .mock-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) repeat(2, minmax(0, 0.75fr));
      gap: 7px;
      margin-bottom: 12px;
    }

    .mock-input,
    .mock-button,
    .mock-action {
      min-height: 30px;
      background: #edf0f4;
      border: 1px solid #d5d8de;
      border-radius: 5px;
    }

    .mock-button {
      background: #dce5fb;
      border-color: #bdccf3;
    }

    .mock-actionbar {
      display: none;
      min-height: 34px;
      margin-bottom: 10px;
      background: #17212b;
      border-radius: 5px;
    }

    .structural-preview.after .mock-actionbar,
    .mock-window.after .mock-actionbar {
      display: block;
    }

    .mock-table {
      overflow: hidden;
      border: 1px solid #d6d8dc;
      border-radius: 6px;
    }

    .mock-table-row {
      display: grid;
      grid-template-columns: 26px minmax(0, 2fr) minmax(0, 1fr) minmax(0, 0.8fr);
      gap: 8px;
      min-height: 34px;
      padding: 8px;
      border-bottom: 1px solid #e4e5e8;
    }

    .mock-table-row:last-child {
      border-bottom: 0;
    }

    .mock-cell {
      height: 7px;
      align-self: center;
      background: #e3e5e9;
      border-radius: 2px;
    }

    .mock-cell:first-child {
      width: 12px;
      height: 12px;
      border: 1px solid #bfc4cc;
      background: transparent;
    }

    .mock-section-list {
      display: grid;
      gap: 8px;
      margin-top: 13px;
    }

    .mock-section {
      padding: 9px 10px;
      color: var(--ink-soft);
      background: #f4f5f7;
      border-left: 3px solid #b5bfce;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .mock-window.after .mock-section {
      border-left-color: var(--blue);
    }

    .annotation-dot {
      position: absolute;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      color: #fff;
      background: var(--blue);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 9px rgba(23, 33, 43, 0.24);
      font-family: "Bahnschrift", sans-serif;
      font-size: 12px;
      font-weight: 700;
      transform: translate(-50%, -50%);
    }

    .annotation-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 13px;
    }

    .annotation-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      background: #fff;
    }

    .annotation-number {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      color: #fff;
      background: var(--blue);
      border-radius: 50%;
      font-family: "Bahnschrift", sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    .evidence-note {
      margin-top: 12px;
      padding: 10px 12px;
      color: #6a4b21;
      background: var(--amber-soft);
      border: 1px solid #e7c390;
      border-radius: 8px;
      font-size: 13px;
    }

    .table-pan {
      overflow: auto;
      overscroll-behavior: contain;
      border: 1px solid var(--rule);
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
      background: var(--paper);
    }

    caption {
      padding: 9px 11px;
      color: var(--muted);
      text-align: left;
      background: #e9e6df;
      font-size: 12px;
    }

    th,
    td {
      padding: 10px 11px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--rule);
      overflow-wrap: anywhere;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--ink-soft);
      background: #eeece6;
      font-size: 12px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .glossary-item {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 10px;
    }

    .glossary-item summary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      min-height: 58px;
      padding: 14px;
      cursor: pointer;
      list-style: none;
    }

    .glossary-item summary::-webkit-details-marker {
      display: none;
    }

    .glossary-term {
      min-width: 0;
    }

    .glossary-term strong {
      display: block;
      margin-bottom: 3px;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .glossary-term small {
      display: block;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .explain-badge,
    .term-help {
      display: inline-block;
      max-width: 100%;
      color: var(--blue);
      font-size: 12px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .explain-badge {
      flex: 0 0 auto;
      padding: 3px 7px;
      background: var(--blue-soft);
      border: 1px solid #c5d3fa;
      border-radius: 5px;
    }

    .glossary-detail {
      padding: 0 14px 15px;
      border-top: 1px solid var(--rule);
    }

    .glossary-detail p {
      margin: 12px 0 0;
    }

    .inline-explanation {
      color: var(--blue);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
    }

    .handoff-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .handoff-card {
      padding: 17px;
      box-shadow: none;
    }

    .handoff-card.wide {
      grid-column: 1 / -1;
    }

    .handoff-card ul {
      margin: 10px 0 0;
      padding-left: 20px;
    }

    .handoff-card li {
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .prompt-box {
      margin-top: 10px;
      padding: 13px;
      color: var(--ink-soft);
      background: #eff2f8;
      border: 1px solid #cbd4e6;
      border-radius: 8px;
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .empty-state {
      padding: 24px;
      color: var(--muted);
      text-align: center;
      background: #efede7;
      border: 1px dashed var(--rule-strong);
      border-radius: 9px;
    }

    .footer-note {
      margin-top: 28px;
      padding-top: 15px;
      color: var(--muted);
      border-top: 1px solid var(--rule);
      font-size: 12px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1120px) {
      .summary-grid,
      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .module-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .page-grid,
      .feature-contract,
      .changes-grid,
      .glossary-grid,
      .handoff-grid {
        grid-template-columns: 1fr;
      }

      .two-column {
        grid-template-columns: 1fr;
      }

      .dependency-row {
        grid-template-columns: minmax(0, 1fr) 54px minmax(0, 1fr);
      }

      .dependency-description {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 860px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: relative;
        height: auto;
        max-height: none;
      }

      .sidebar-brand {
        padding: 20px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        margin-bottom: 9px;
      }

      .sidebar-brand h1 {
        font-size: 19px;
      }

      .coverage-box,
      .nav-label {
        display: none;
      }

      .view-nav {
        display: flex;
        gap: 7px;
        padding: 11px 14px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scrollbar-width: thin;
      }

      .nav-button {
        grid-template-columns: auto auto;
        flex: 0 0 auto;
        width: auto;
        min-height: 44px;
        padding: 8px 12px;
      }

      .nav-icon {
        display: none;
      }

      .sidebar-tools {
        display: none;
      }

      .main-shell {
        padding-top: 20px;
      }

      .comparison-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      body {
        font-size: 14px;
      }

      .main-shell {
        padding: 17px 12px 44px;
      }

      .topbar,
      .view-heading,
      .panel-header,
      .comparison-head,
      .feature-top {
        display: block;
      }

      .top-actions {
        justify-content: flex-start;
        margin-top: 14px;
      }

      .summary-grid,
      .metric-grid,
      .module-grid,
      .state-grid,
      .annotation-grid {
        grid-template-columns: 1fr;
      }

      .stage-line {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dependency-row {
        grid-template-columns: 1fr;
      }

      .dependency-arrow {
        text-align: left;
      }

      .comparison-head .segmented {
        margin-top: 13px;
      }

      .compare-canvas {
        min-height: 300px;
        padding: 10px;
      }

      .mock-window {
        padding: 11px;
      }

      .mock-toolbar {
        grid-template-columns: 1fr;
      }

      .mock-table-row {
        grid-template-columns: 24px minmax(0, 1fr);
      }

      .mock-table-row .mock-cell:nth-child(n + 3) {
        display: none;
      }

      .glossary-item summary {
        display: block;
      }

      .explain-badge {
        margin-top: 9px;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .app-shell {
        display: block;
      }

      .sidebar,
      .top-actions,
      .segmented,
      .toolbar button {
        display: none !important;
      }

      .main-shell {
        padding: 0;
      }

      .panel,
      .feature-card,
      .page-card,
      .change-card,
      .comparison-block,
      .handoff-card {
        box-shadow: none;
        break-inside: avoid;
      }
    }
      input[type="search"] { color: var(--ink-soft); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="项目地图目录">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">A</div>
        <h1 id="project-name">项目地图工作台</h1>
        <p id="project-summary"></p>
      </div>

      <div class="coverage-box">
        <div class="coverage-title">
          <span>本次已审阅页面</span>
          <strong class="coverage-number" id="coverage-number">0 / 0</strong>
        </div>
        <div class="coverage-track" aria-hidden="true">
          <div class="coverage-fill" id="coverage-fill" style="width:0%"></div>
        </div>
      </div>

      <p class="nav-label">审阅目录</p>
      <nav class="view-nav" id="view-nav" aria-label="切换工作台页面">
        <button class="nav-button" type="button" data-view="overview" aria-selected="true">
          <span class="nav-icon" aria-hidden="true">01</span>
          <span>总览</span>
          <span class="nav-count" data-count="attention">0</span>
        </button>
        <button class="nav-button" type="button" data-view="pages" aria-selected="false">
          <span class="nav-icon" aria-hidden="true">02</span>
          <span>页面与状态</span>
          <span class="nav-count" data-count="pages">0</span>
        </button>
        <button class="nav-button" type="button" data-view="features" aria-selected="false">
          <span class="nav-icon" aria-hidden="true">03</span>
          <span>功能基准</span>
          <span class="nav-count" data-count="features">0</span>
        </button>
        <button class="nav-button" type="button" data-view="dependencies" aria-selected="false">
          <span class="nav-icon" aria-hidden="true">04</span>
          <span>依赖关系</span>
          <span class="nav-count" data-count="dependencies">0</span>
        </button>
        <button class="nav-button" type="button" data-view="changes" aria-selected="false">
          <span class="nav-icon" aria-hidden="true">05</span>
          <span>本次改动</span>
          <span class="nav-count" data-count="changes">0</span>
        </button>
        <button class="nav-button" type="button" data-view="compare" aria-selected="false">
          <span class="nav-icon" aria-hidden="true">06</span>
          <span>前后对照</span>
          <span class="nav-count" data-count="comparisons">0</span>
        </button>
        <button class="nav-button" type="button" data-view="glossary" aria-selected="false">
          <span class="nav-icon" aria-hidden="true">07</span>
          <span>术语解释</span>
          <span class="nav-count" data-count="glossary">0</span>
        </button>
        <button class="nav-button" type="button" data-view="handoff" aria-selected="false">
          <span class="nav-icon" aria-hidden="true">08</span>
          <span>交接与下一步</span>
          <span class="nav-count" data-count="handoff">0</span>
        </button>
      </nav>

      <div class="sidebar-tools">
        <p>宽屏画板缩放</p>
        <div class="zoom-tools" aria-label="画板缩放">
          <button type="button" data-zoom="-10" aria-label="缩小">−</button>
          <button type="button" data-zoom="0" aria-label="恢复百分之百">100%</button>
          <button type="button" data-zoom="10" aria-label="放大">＋</button>
        </div>
      </div>
    </aside>

    <main class="main-shell" id="main-content" tabindex="-1">
      <div class="main-shell-inner" id="zoom-surface">
        <header class="topbar">
          <div>
            <div class="breadcrumb" id="breadcrumb">项目地图工作台 / 总览</div>
            <div class="pill-row" id="project-pills"></div>
          </div>
          <div class="top-actions">
            <button type="button" id="copy-summary">复制交接摘要</button>
            <button class="primary" type="button" onclick="window.print()">打印或导出 PDF</button>
          </div>
        </header>

        <div class="view-content" id="view-content" aria-live="polite"></div>
        <footer class="footer-note">
          本工作台由 <strong>Project Atlas Guardian</strong> 模板生成。结构预览只解释布局关系；
          真实完成状态必须用同页面、同状态、同尺寸的截图、测试和业务流证据确认。
        </footer>
      </div>
    </main>
  </div>

  <script>
    const atlas = __PROJECT_ATLAS_DATA__;

    const STATUS_LABELS = {
      confirmed: "已确认",
      in_progress: "开发中",
      unverified: "待验证",
      experimental: "实验性",
      deprecated: "已废弃",
      retained: "保留",
      moved: "移动",
      added: "新增",
      removed: "明确删除",
      pending: "待确认",
      missing: "缺失",
      accepted: "已验收",
      development: "开发中",
      verification: "验收中",
      prototype: "原型",
      preview: "预览",
      open: "未完成",
      closed: "已完成"
    };

    const VIEW_META = {
      overview: ["总览", "先用一屏看清项目阶段、范围、风险和未完成事项。"],
      pages: ["页面与状态", "按模块查看全部页面、窗口、弹窗、菜单和重要状态。"],
      features: ["功能基准", "核对每个功能从哪里进入、做什么、保存什么、现在到哪一步。"],
      dependencies: ["依赖关系", "看清页面、功能和数据服务之间的连接，避免局部修改破坏下游。"],
      changes: ["本次改动", "把为什么改、风险、验收标准和当前状态放在一起。"],
      compare: ["前后对照", "在相同页面和状态下比较当前与改后，并用编号解释每处变化。"],
      glossary: ["术语解释", "所有不容易理解的词都给出可直接阅读的大白话解释。"],
      handoff: ["交接与下一步", "给新聊天窗口或下一位 AI 一份准确、可验证的当前状态。"]
    };

    const STAGES = ["PRD", "全页面", "Issue 拆分", "开发", "验收", "发布", "维护"];
    const STAGE_INDEX = {
      discovery: 0,
      prd: 0,
      design: 1,
      pages: 1,
      planning: 2,
      implementation: 3,
      development: 3,
      acceptance: 4,
      verification: 4,
      release: 5,
      maintenance: 6,
      "基准已建立，正在补接线与修 P0": 3
    };

    const MODE_EXPLANATIONS = {
      R: "严格按照用户提供的页面、截图或设计稿复刻，未经确认不增加视觉改动。",
      I: "学习参考中的有效方法，但最终页面必须在布局、层级、交互或视觉语言上形成明确差异。",
      H: "只在用户确认后，把多个方案的明确优点组合成一个经过判断的新方案。",
      "": "尚未确定设计依据，开始视觉工作前必须先确认。"
    };

    const DEPTH_EXPLANATIONS = {
      reskin: "只改颜色、字体和组件外观，路由、业务逻辑、数据结构与交互保持不动。",
      relayout: "允许重新安排区域和位置，但所有已有功能必须保留并重新接回。",
      rebuild: "页面结构和实现都可能替换，风险最高，必须先完成完整功能对照。",
      "": "尚未确定这次改动会影响多深。"
    };

    let activeView = "overview";
    let zoom = 100;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function byId(items, id) {
      return safeArray(items).find((item) => item.id === id);
    }

    function moduleById(id) {
      return byId(atlas.modules, id);
    }

    function pageById(id) {
      return byId(atlas.pages, id);
    }

    function featureById(id) {
      return byId(atlas.features, id);
    }

    function resourceById(id) {
      return byId(atlas.resources, id);
    }

    function statusLabel(status) {
      return STATUS_LABELS[status] || status || "未标注";
    }

    function statusBadge(status) {
      const label = statusLabel(status);
      return `<span class="status status-${escapeHtml(status || "unknown")}">${escapeHtml(label)}</span>`;
    }

    function plainList(items, empty = "没有记录") {
      const values = safeArray(items).filter(Boolean);
      if (!values.length) return `<p class="empty-state">${escapeHtml(empty)}</p>`;
      return `<ul>${values.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function termExplanation(term, explanation) {
      return `<span class="inline-explanation">${escapeHtml(term)} [解释：${escapeHtml(explanation)}]</span>`;
    }

    function pageLabel(id) {
      return pageById(id)?.title || id || "未关联页面";
    }

    function resourceLabel(id) {
      return resourceById(id)?.name || featureById(id)?.name || pageById(id)?.title || moduleById(id)?.name || id || "未知节点";
    }

    function previewMarkup(preview, variant = "before", annotations = []) {
      if (!preview) {
        return `<div class="empty-state">没有提供结构预览或截图。</div>`;
      }

      if (preview.image) {
        const dots = annotations.map((note) => {
          if (!Number.isFinite(Number(note.x)) || !Number.isFinite(Number(note.y))) return "";
          return `<span class="annotation-dot" style="left:${Number(note.x)}%;top:${Number(note.y)}%" aria-label="标注 ${escapeHtml(note.number)}：${escapeHtml(note.title)}">${escapeHtml(note.number)}</span>`;
        }).join("");
        return `
          <div class="compare-canvas">
            <img src="${escapeHtml(preview.image)}" alt="${escapeHtml(preview.alt || preview.label || "页面截图")}" style="display:block;width:100%;height:auto;border-radius:8px;">
            ${dots}
          </div>`;
      }

      const sections = safeArray(preview.sections);
      const dots = annotations.map((note) => {
        if (!Number.isFinite(Number(note.x)) || !Number.isFinite(Number(note.y))) return "";
        return `<span class="annotation-dot" style="left:${Number(note.x)}%;top:${Number(note.y)}%" aria-label="标注 ${escapeHtml(note.number)}：${escapeHtml(note.title)}">${escapeHtml(note.number)}</span>`;
      }).join("");

      return `
        <div class="compare-canvas">
          <div class="mock-window ${escapeHtml(variant)}">
            <div class="mock-titlebar">
              <strong>${escapeHtml(preview.title || "页面结构预览")}</strong>
              <span class="mock-button" style="width:92px" aria-hidden="true"></span>
            </div>
            <div class="mock-toolbar" aria-hidden="true">
              <span class="mock-input"></span>
              <span class="mock-button"></span>
              <span class="mock-input"></span>
            </div>
            <div class="mock-actionbar" aria-hidden="true"></div>
            <div class="mock-table" aria-hidden="true">
              ${Array.from({ length: 4 }).map(() => `
                <div class="mock-table-row">
                  <span class="mock-cell"></span>
                  <span class="mock-cell"></span>
                  <span class="mock-cell"></span>
                  <span class="mock-cell"></span>
                </div>
              `).join("")}
            </div>
            <div class="mock-section-list">
              ${sections.map((section) => `<div class="mock-section">${escapeHtml(section)}</div>`).join("")}
            </div>
          </div>
          ${dots}
        </div>
        <p class="preview-caption">结构示意只用于比较布局关系，不能替代真实页面截图和验收。</p>
      `;
    }

    function renderProjectChrome() {
      const project = atlas.project || {};
      const coverage = atlas.coverage || {};
      $("#project-name").textContent = project.name || "未命名项目";
      $("#project-summary").textContent = project.summary || "尚未填写项目摘要。";

      const total = Number(coverage.totalPages || safeArray(atlas.pages).length || 0);
      const audited = Number(coverage.auditedPages || 0);
      const percent = total > 0 ? Math.min(100, Math.round((audited / total) * 100)) : 0;
      $("#coverage-number").textContent = `${audited} / ${total}`;
      $("#coverage-fill").style.width = `${percent}%`;

      const mode = String(project.reviewMode || "");
      const depth = String(project.changeDepth || "");
      $("#project-pills").innerHTML = `
        <span class="pill">当前阶段：${escapeHtml(project.stage || "未标注")}</span>
        <span class="pill">工作模式：${escapeHtml(mode || "待确认")} <span class="inline-explanation">[解释：${escapeHtml(MODE_EXPLANATIONS[mode] || MODE_EXPLANATIONS[""])}]</span></span>
        <span class="pill">改动深度：${escapeHtml(depth || "待确认")} <span class="inline-explanation">[解释：${escapeHtml(DEPTH_EXPLANATIONS[depth] || DEPTH_EXPLANATIONS[""])}]</span></span>
        <span class="pill">更新时间：${escapeHtml(atlas.generatedAt || "未记录")}</span>
      `;

      const counts = {
        pages: safeArray(atlas.pages).length,
        features: safeArray(atlas.features).length,
        dependencies: safeArray(atlas.dependencies).length,
        changes: safeArray(atlas.changes).length,
        comparisons: safeArray(atlas.comparisons).length,
        glossary: safeArray(atlas.glossary).length,
        handoff: atlas.handoff ? 1 : 0,
        attention: safeArray(atlas.features).filter((feature) => ["unverified", "experimental"].includes(feature.status) || ["pending", "missing"].includes(feature.parity?.status)).length
          + safeArray(atlas.changes).filter((change) => ["pending", "in_progress", "unverified"].includes(change.status)).length
      };
      $$("[data-count]").forEach((node) => {
        node.textContent = String(counts[node.dataset.count] ?? 0);
      });
    }

    function renderOverview() {
      const project = atlas.project || {};
      const coverage = atlas.coverage || {};
      const currentIndex = STAGE_INDEX[project.stage] ?? 3;
      const unresolved = [
        ...safeArray(atlas.features)
          .filter((feature) => ["unverified", "experimental"].includes(feature.status) || ["pending", "missing"].includes(feature.parity?.status))
          .map((feature) => ({
            title: feature.name,
            detail: `功能状态：${statusLabel(feature.status)}；改版对照：${statusLabel(feature.parity?.status)}。${feature.parity?.reason || ""}`,
            type: feature.id
          })),
        ...safeArray(atlas.changes)
          .filter((change) => ["pending", "in_progress", "unverified"].includes(change.status))
          .map((change) => ({
            title: change.title,
            detail: `改动状态：${statusLabel(change.status)}。风险：${change.risk}`,
            type: change.id
          }))
      ];

      const moduleMarkup = safeArray(atlas.modules).map((module) => {
        const pageCount = safeArray(atlas.pages).filter((page) => page.moduleId === module.id).length;
        const featureCount = safeArray(atlas.features).filter((feature) => feature.moduleId === module.id).length;
        return `
          <article class="module-card">
            <div class="pill-row">${statusBadge(module.status)}<span class="pill">${pageCount} 个页面</span><span class="pill">${featureCount} 个功能</span></div>
            <h3 style="margin-top:11px">${escapeHtml(module.name)}</h3>
            <p>${escapeHtml(module.summary)}</p>
          </article>`;
      }).join("");

      const limitations = safeArray(coverage.limitations);

      return `
        <section class="view-heading">
          <div>
            <span class="eyebrow">项目现在怎么样</span>
            <h2>${escapeHtml(project.name || "项目总览")}</h2>
            <p>${escapeHtml(project.summary || "")}</p>
          </div>
          <div class="pill-row">
            ${statusBadge(safeArray(atlas.changes).some((item) => ["pending", "in_progress", "unverified"].includes(item.status)) ? "in_progress" : "confirmed")}
          </div>
        </section>

        <section class="panel section" aria-labelledby="stage-title">
          <div class="panel-header">
            <div>
              <h3 id="stage-title">项目阶段</h3>
              <p>这里不是装饰进度条，而是当前事实；只有通过对应验收才会向前移动。</p>
            </div>
          </div>
          <div class="stage-line" aria-label="项目阶段">
            ${STAGES.map((stage, index) => `<div class="stage-step ${index < currentIndex ? "done" : index === currentIndex ? "current" : ""}"><span class="sr-only">${index < currentIndex ? "已完成：" : index === currentIndex ? "当前：" : "尚未开始："}</span>${escapeHtml(stage)}</div>`).join("")}
          </div>
        </section>

        <section class="summary-grid section" aria-label="覆盖统计">
          <div class="metric"><strong>${Number(coverage.auditedPages || 0)} / ${Number(coverage.totalPages || 0)}</strong><span>已审阅页面和连接界面</span></div>
          <div class="metric"><strong>${Number(coverage.auditedFeatures || 0)} / ${Number(coverage.totalFeatures || 0)}</strong><span>已核对功能基准</span></div>
          <div class="metric"><strong>${Number(coverage.auditedStates || 0)}</strong><span>已登记页面状态</span></div>
          <div class="metric"><strong>${unresolved.length}</strong><span>仍需确认或验证</span></div>
        </section>

        <div class="two-column section">
          <section class="panel">
            <div class="panel-header">
              <div>
                <h3>现在必须注意</h3>
                <p>这些事项没有通过验收前，不能把改版说成完成。</p>
              </div>
              <span class="pill">${termExplanation("风险", "可能造成功能丢失、数据错误、隐私泄露或用户体验异常的情况。")}</span>
            </div>
            ${unresolved.length ? `
              <ul class="list-reset attention-list">
                ${unresolved.map((item) => `<li class="attention-item"><strong>${escapeHtml(item.title)}</strong><p>${escapeHtml(item.detail)}</p></li>`).join("")}
              </ul>` : `<div class="empty-state">当前没有登记的未完成功能或风险。</div>`}
          </section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <h3>业务流状态</h3>
                <p>用户能否从入口一路完成目标，比单页是否好看更重要。</p>
              </div>
            </div>
            <ul class="list-reset flow-list">
              ${safeArray(atlas.flows).map((flow) => `
                <li class="flow-item">
                  <div class="pill-row" style="margin-bottom:7px">${statusBadge(flow.status)}</div>
                  <strong>${escapeHtml(flow.name)}</strong>
                  <p>${escapeHtml(safeArray(flow.steps).join(" → ") || "尚未记录步骤")}</p>
                  ${flow.blocker ? `<p style="margin-top:7px;color:var(--red)"><strong>卡点：</strong>${escapeHtml(flow.blocker)}</p>` : ""}
                </li>`).join("")}
            </ul>
          </section>
        </div>

        <section class="section">
          <div class="module-grid">${moduleMarkup}</div>
        </section>

        ${limitations.length ? `<section class="evidence-note" aria-label="本轮限制"><strong>本轮证据限制：</strong>${limitations.map(escapeHtml).join("；")}</section>` : ""}
      `;
    }

    function renderPages() {
      const statuses = [...new Set(safeArray(atlas.pages).map((page) => page.status).filter(Boolean))];
      return `
        <section class="view-heading">
          <div>
            <span class="eyebrow">系统里有什么</span>
            <h2>页面与状态</h2>
            <p>页面、弹窗、菜单和状态放在一起看；任何一个必需状态缺失，都表示功能还不完整。</p>
          </div>
        </section>
        <div class="toolbar">
          <div class="field">
            <label for="page-search">搜索页面、路由或功能</label>
            <input id="page-search" type="search" placeholder="例如：合同、上传、设置">
          </div>
          <div class="field">
            <label for="page-status">按状态筛选</label>
            <select id="page-status">
              <option value="">全部状态</option>
              ${statuses.map((status) => `<option value="${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</option>`).join("")}
            </select>
          </div>
          <div class="result-note" id="page-result-note" aria-live="polite"></div>
        </div>
        <div id="page-tree"></div>
      `;
    }

    function renderPageTree() {
      const query = ($("#page-search")?.value || "").trim().toLowerCase();
      const status = $("#page-status")?.value || "";
      const allFeatures = safeArray(atlas.features);

      function matches(page) {
        if (status && page.status !== status) return false;
        if (!query) return true;
        const featureNames = safeArray(page.featureIds).map((id) => featureById(id)?.name || "").join(" ");
        const haystack = [page.title, page.route, page.summary, page.surfaceType, featureNames].join(" ").toLowerCase();
        return haystack.includes(query);
      }

      let visible = 0;
      const modules = safeArray(atlas.modules).map((module) => {
        const pages = safeArray(atlas.pages).filter((page) => page.moduleId === module.id && matches(page));
        visible += pages.length;
        if (!pages.length) return "";
        return `
          <section class="module-section">
            <div class="module-heading">
              <div>
                <h3>${escapeHtml(module.name)}</h3>
                <p>${escapeHtml(module.summary)}</p>
              </div>
              <span class="pill">${pages.length} 个界面</span>
            </div>
            <div class="page-grid">
              ${pages.map((page) => {
                const pagesFeatures = safeArray(page.featureIds).map((id) => featureById(id)).filter(Boolean);
                return `
                  <article class="page-card">
                    <div class="page-card-header">
                      <div>
                        <div class="pill-row">${statusBadge(page.status)}<span class="pill">${escapeHtml(page.surfaceType || "page")}</span></div>
                        <h3 style="margin-top:10px">${escapeHtml(page.title)}</h3>
                        <span class="page-route">${escapeHtml(page.route || "未记录入口")}</span>
                      </div>
                    </div>
                    <p class="page-summary">${escapeHtml(page.summary)}</p>
                    <div>
                      <div class="micro-label" style="margin-bottom:7px">重要状态</div>
                      <div class="state-grid">
                        ${safeArray(page.states).map((state) => `
                          <div class="state-card">
                            <strong>${escapeHtml(state.name)}</strong>
                            ${previewMarkup({ variant: "before", title: `${page.title} · ${state.name}`, sections: [state.status === "confirmed" ? "已确认状态" : statusLabel(state.status), "内容区域", "操作区域"] })}
                            <div class="pill-row" style="margin-top:7px">${statusBadge(state.status)}</div>
                          </div>`).join("")}
                      </div>
                    </div>
                    <div>
                      <div class="micro-label" style="margin-bottom:6px">功能与入口</div>
                      <div class="page-foot">
                        ${pagesFeatures.map((feature) => `<span class="pill">${escapeHtml(feature.name)}</span>`).join("") || `<span class="pill">未关联功能</span>`}
                      </div>
                    </div>
                  </article>`;
              }).join("")}
            </div>
          </section>`;
      }).join("");

      const note = $("#page-result-note");
      if (note) note.textContent = `显示 ${visible} / ${safeArray(atlas.pages).length} 个界面`;
      const tree = $("#page-tree");
      if (tree) tree.innerHTML = modules || `<div class="empty-state">没有符合筛选条件的页面。清空搜索或切换状态后再看。</div>`;
    }

    function renderFeatures() {
      const featureStatuses = [...new Set(safeArray(atlas.features).map((feature) => feature.status).filter(Boolean))];
      const parityStatuses = [...new Set(safeArray(atlas.features).map((feature) => feature.parity?.status).filter(Boolean))];
      return `
        <section class="view-heading">
          <div>
            <span class="eyebrow">每个功能必须怎么表现</span>
            <h2>功能基准</h2>
            <p>${termExplanation("功能基准", "每个功能从哪进入、用户能做什么、完成后发生什么、数据保存在哪里，以及哪些状态必须完整。")}</p>
          </div>
        </section>
        <div class="toolbar">
          <div class="field">
            <label for="feature-search">搜索功能、页面或说明</label>
            <input id="feature-search" type="search" placeholder="例如：筛选、上传、恢复">
          </div>
          <div class="field">
            <label for="feature-status">功能状态</label>
            <select id="feature-status">
              <option value="">全部功能状态</option>
              ${featureStatuses.map((status) => `<option value="${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label for="feature-parity">改版对照</label>
            <select id="feature-parity">
              <option value="">全部对照结果</option>
              ${parityStatuses.map((status) => `<option value="${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</option>`).join("")}
            </select>
          </div>
          <div class="result-note" id="feature-result-note" aria-live="polite"></div>
        </div>
        <div id="feature-list"></div>
      `;
    }

    function renderFeatureList() {
      const query = ($("#feature-search")?.value || "").trim().toLowerCase();
      const status = $("#feature-status")?.value || "";
      const parity = $("#feature-parity")?.value || "";
      const filtered = safeArray(atlas.features).filter((feature) => {
        if (status && feature.status !== status) return false;
        if (parity && feature.parity?.status !== parity) return false;
        if (!query) return true;
        const pages = safeArray(feature.pageIds).map(pageLabel).join(" ");
        return [feature.name, feature.contract?.entry, feature.contract?.outcome, pages].join(" ").toLowerCase().includes(query);
      });

      const countNode = $("#feature-result-note");
      if (countNode) countNode.textContent = `显示 ${filtered.length} / ${safeArray(atlas.features).length} 个功能`;
      const list = $("#feature-list");
      if (!list) return;

      if (!filtered.length) {
        list.innerHTML = `<div class="empty-state">没有符合条件的功能。清空筛选后再试。</div>`;
        return;
      }

      list.innerHTML = `
        <div class="feature-list">
          ${filtered.map((feature) => {
            const contract = feature.contract || {};
            return `
              <article class="feature-card">
                <div class="feature-top">
                  <div class="feature-title">
                    <div class="pill-row">${statusBadge(feature.status)}${statusBadge(feature.parity?.status)}</div>
                    <h3 style="margin-top:11px">${escapeHtml(feature.name)}</h3>
                    <div class="pill-row">${safeArray(feature.pageIds).map((id) => `<span class="pill">${escapeHtml(pageLabel(id))}</span>`).join("")}</div>
                  </div>
                  <span class="pill">${escapeHtml(feature.id)}</span>
                </div>
                <dl class="feature-contract">
                  <div class="contract-row"><dt>从哪里进入</dt><dd>${escapeHtml(contract.entry || "未记录")}</dd></div>
                  <div class="contract-row"><dt>用户能做什么</dt><dd>${escapeHtml(safeArray(contract.actions).join("；") || "未记录")}</dd></div>
                  <div class="contract-row"><dt>操作完成后必须发生什么</dt><dd>${escapeHtml(contract.outcome || "未记录")}</dd></div>
                  <div class="contract-row"><dt>数据怎样保存和刷新</dt><dd>${escapeHtml(contract.data || "未记录")}</dd></div>
                  <div class="contract-row"><dt>必须覆盖的状态</dt><dd>${safeArray(contract.states).map((item) => `<span class="pill" style="margin:0 4px 4px 0">${escapeHtml(item)}</span>`).join("") || "未记录"}</dd></div>
                  <div class="contract-row"><dt>不能擅自改变</dt><dd>${escapeHtml(safeArray(contract.locked).join("；") || "未记录")}</dd></div>
                </dl>
                <div class="feature-evidence">
                  <span><strong>现在在哪：</strong>${escapeHtml(feature.parity?.beforeLocation || "未记录")}</span>
                  <span><strong>改后在哪：</strong>${escapeHtml(feature.parity?.afterLocation || "未记录")}</span>
                  <span><strong>结论：</strong>${escapeHtml(statusLabel(feature.parity?.status))}</span>
                </div>
              </article>`;
          }).join("")}
        </div>`;
    }

    function renderDependencies() {
      const dependencies = safeArray(atlas.dependencies);
      const resources = safeArray(atlas.resources);
      return `
        <section class="view-heading">
          <div>
            <span class="eyebrow">改动会传到哪里</span>
            <h2>依赖关系</h2>
            <p>${termExplanation("依赖关系", "一个页面或功能需要另一项数据、接口、文件或服务才能正常工作；上游变化可能影响所有下游使用者。")}</p>
          </div>
        </section>
        <div class="two-column">
          <section class="panel">
            <div class="panel-header">
              <div>
                <h3>连接清单</h3>
                <p>从左侧来源指向右侧依赖，并说明影响。</p>
              </div>
            </div>
            <div class="dependency-map">
              ${dependencies.length ? dependencies.map((dependency) => `
                <div class="dependency-row">
                  <div class="dependency-node"><small>来源</small><strong>${escapeHtml(resourceLabel(dependency.from))}</strong></div>
                  <div class="dependency-arrow" aria-label="依赖">→ 依赖 →</div>
                  <div class="dependency-node"><small>${escapeHtml(dependency.kind || "连接")}</small><strong>${escapeHtml(resourceLabel(dependency.to))}</strong></div>
                  <div class="dependency-description">${escapeHtml(dependency.description)}<div class="pill-row" style="margin-top:7px">${statusBadge(dependency.status)}</div></div>
                </div>`).join("") : `<div class="empty-state">还没有登记依赖关系。</div>`}
            </div>
          </section>
          <section class="panel">
            <div class="panel-header">
              <div>
                <h3>共享数据和服务</h3>
                <p>这些节点一旦改变，通常会影响多个页面。</p>
              </div>
            </div>
            <ul class="list-reset resource-list">
              ${resources.length ? resources.map((resource) => {
                const consumers = dependencies.filter((dependency) => dependency.to === resource.id).map((dependency) => resourceLabel(dependency.from));
                return `
                  <li class="resource-item">
                    <div class="pill-row" style="margin-bottom:7px">${statusBadge(resource.status)}<span class="pill">${escapeHtml(resource.kind || "服务")}</span></div>
                    <strong>${escapeHtml(resource.name)}</strong>
                    <p>${escapeHtml(resource.summary || "")}</p>
                    <p style="margin-top:6px"><strong>被使用：</strong>${escapeHtml(consumers.join("、") || "暂未发现")}</p>
                  </li>`;
              }).join("") : `<li class="empty-state">还没有登记共享服务或数据。</li>`}
            </ul>
          </section>
        </div>
      `;
    }

    function renderChanges() {
      return `
        <section class="view-heading">
          <div>
            <span class="eyebrow">这次究竟改什么</span>
            <h2>本次改动</h2>
            <p>每项改动都要说明原因、风险、验收标准和当前状态；不能只写“优化页面”。</p>
          </div>
        </section>
        <div class="changes-grid">
          ${safeArray(atlas.changes).map((change) => `
            <article class="change-card">
              <div class="pill-row">${statusBadge(change.status)}${safeArray(change.pages).map((id) => `<span class="pill">${escapeHtml(pageLabel(id))}</span>`).join("")}</div>
              <h3>${escapeHtml(change.title)}</h3>
              <div class="change-block"><strong>为什么改</strong><p>${escapeHtml(change.why)}</p></div>
              <div class="change-block"><strong>有什么风险</strong><p>${escapeHtml(change.risk)}</p></div>
              <div class="change-block"><strong>怎样才算完成</strong><p>${escapeHtml(change.acceptance)}</p></div>
              <div class="change-block"><strong>关联功能</strong><div class="pill-row">${safeArray(change.features).map((id) => `<span class="pill">${escapeHtml(featureById(id)?.name || id)}</span>`).join("") || `<span class="pill">未关联</span>`}</div></div>
            </article>`).join("") || `<div class="empty-state">还没有记录本次改动。</div>`}
        </div>
      `;
    }

    function renderComparisons() {
      return `
        <section class="view-heading">
          <div>
            <span class="eyebrow">同条件看差异</span>
            <h2>前后对照</h2>
            <p>编号代表同一处变化；当前页和改后页必须在相同状态、语言、主题和尺寸下比较。</p>
          </div>
        </section>
        <div id="comparison-list">
          ${safeArray(atlas.comparisons).map((comparison) => {
            const notes = safeArray(comparison.notes);
            return `
              <article class="comparison-block section" data-mode="split" data-comparison="${escapeHtml(comparison.id)}">
                <div class="comparison-head">
                  <div>
                    <h3>${escapeHtml(comparison.title)}</h3>
                    <p>${escapeHtml(comparison.context || "比较条件未记录")}</p>
                  </div>
                  <div class="segmented" role="group" aria-label="切换对照方式">
                    <button type="button" data-compare-mode="before" aria-pressed="false">只看当前</button>
                    <button type="button" data-compare-mode="split" aria-pressed="true">并排比较</button>
                    <button type="button" data-compare-mode="after" aria-pressed="false">只看改后</button>
                  </div>
                </div>
                <div class="comparison-layout">
                  <section class="compare-pane before-pane">
                    <div class="pane-title"><strong>${escapeHtml(comparison.before?.label || "当前")}</strong>${statusBadge("retained")}</div>
                    ${previewMarkup(comparison.before?.preview || { image: comparison.before?.image }, "before", [])}
                  </section>
                  <section class="compare-pane after-pane">
                    <div class="pane-title"><strong>${escapeHtml(comparison.after?.label || "改后")}</strong>${statusBadge("moved")}</div>
                    ${previewMarkup(comparison.after?.preview || { image: comparison.after?.image }, "after", notes)}
                  </section>
                </div>
                <div class="annotation-grid">
                  ${notes.map((note) => `
                    <div class="annotation-item">
                      <span class="annotation-number">${escapeHtml(note.number)}</span>
                      <div><strong>${escapeHtml(note.title)}</strong><p>${escapeHtml(note.detail)}</p></div>
                    </div>`).join("")}
                </div>
                <div class="evidence-note">
                  如果当前或改后没有真实截图、结构检查、交互测试和业务流证据，这个对照只能用于讨论方向，不能用于宣布完成。
                </div>
              </article>`;
          }).join("") || `<div class="empty-state">还没有前后对照。</div>`}
        </div>
      `;
    }

    function renderGlossary() {
      return `
        <section class="view-heading">
          <div>
            <span class="eyebrow">不需要先学技术词</span>
            <h2>术语解释</h2>
            <p>这里把术语是什么、为什么存在、会不会上传或删除数据，用普通人能理解的话说明白。</p>
          </div>
        </section>
        <div class="toolbar">
          <div class="field">
            <label for="glossary-search">搜索术语或解释</label>
            <input id="glossary-search" type="search" placeholder="例如：commit、依赖、接口">
          </div>
          <div class="result-note" id="glossary-result-note" aria-live="polite"></div>
        </div>
        <div class="glossary-grid" id="glossary-list">
          ${safeArray(atlas.glossary).map((entry) => `
            <details class="glossary-item" open>
              <summary>
                <span class="glossary-term">
                  <strong>${escapeHtml(entry.term)}</strong>
                  <small>${escapeHtml(safeArray(entry.aliases).join("、") || "没有其他叫法")}</small>
                </span>
                <span class="explain-badge">[解释]</span>
              </summary>
              <div class="glossary-detail">
                <p>${escapeHtml(entry.explanation)}</p>
                <p><strong>用在哪里：</strong>${escapeHtml(entry.scope || "项目相关说明")}</p>
              </div>
            </details>`).join("") || `<div class="empty-state">还没有术语解释。</div>`}
        </div>
      `;
    }

    function renderHandoff() {
      const handoff = atlas.handoff || {};
      return `
        <section class="view-heading">
          <div>
            <span class="eyebrow">给下一次对话的事实包</span>
            <h2>交接与下一步</h2>
            <p>${termExplanation("交接记录", "把当前目标、已确认内容、未验证问题、风险和下一步写入文件，让新聊天不必依赖旧聊天记忆。")}</p>
          </div>
        </section>
        <div class="handoff-grid">
          <section class="handoff-card">
            <h3>当前目标</h3>
            <p>${escapeHtml(handoff.goal || "未记录")}</p>
          </section>
          <section class="handoff-card">
            <h3>最后已验证版本</h3>
            <p>${escapeHtml(handoff.lastVerified || "未记录")}</p>
          </section>
          <section class="handoff-card">
            <h3>必须保留</h3>
            ${plainList(handoff.preserve)}
          </section>
          <section class="handoff-card">
            <h3>尚未验证</h3>
            ${plainList(handoff.unverified)}
          </section>
          <section class="handoff-card">
            <h3>下一步</h3>
            ${plainList(handoff.nextStep)}
          </section>
          <section class="handoff-card">
            <h3>已知风险</h3>
            ${plainList(handoff.risks)}
          </section>
          <section class="handoff-card wide">
            <h3>可直接粘贴到新聊天</h3>
            <div class="prompt-box" id="handoff-prompt">${escapeHtml(handoff.nextSessionPrompt || "未提供新会话启动说明。")}</div>
            <div class="button-row" style="margin-top:12px">
              <button type="button" id="copy-prompt-inline">复制启动说明</button>
            </div>
          </section>
        </div>
      `;
    }

    function renderView(view) {
      const content = $("#view-content");
      activeView = view;
      const meta = VIEW_META[view] || VIEW_META.overview;
      $("#breadcrumb").textContent = `项目地图工作台 / ${meta[0]}`;

      const renderers = {
        overview: renderOverview,
        pages: renderPages,
        features: renderFeatures,
        dependencies: renderDependencies,
        changes: renderChanges,
        compare: renderComparisons,
        glossary: renderGlossary,
        handoff: renderHandoff
      };
      content.innerHTML = renderers[view]();

      if (view === "pages") {
        $("#page-search")?.addEventListener("input", renderPageTree);
        $("#page-status")?.addEventListener("change", renderPageTree);
        renderPageTree();
      }
      if (view === "features") {
        $("#feature-search")?.addEventListener("input", renderFeatureList);
        $("#feature-status")?.addEventListener("change", renderFeatureList);
        $("#feature-parity")?.addEventListener("change", renderFeatureList);
        renderFeatureList();
      }
      if (view === "glossary") {
        $("#glossary-search")?.addEventListener("input", filterGlossary);
        updateGlossaryCount();
      }
      bindViewActions();
      $$(".nav-button").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.view === view));
      });
      const url = new URL(window.location.href);
      if (url.protocol === "file:" || url.protocol === "http:" || url.protocol === "https:") {
        url.searchParams.set("view", view);
        window.history.replaceState(null, "", url);
      }
      window.setTimeout(runLayoutAudit, 0);
    }

    function bindViewActions() {
      $$("[data-compare-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          const block = button.closest(".comparison-block");
          const mode = button.dataset.compareMode;
          block.dataset.mode = mode;
          $$("[data-compare-mode]", block).forEach((peer) => {
            peer.setAttribute("aria-pressed", String(peer === button));
          });
        });
      });

      $("#copy-prompt-inline")?.addEventListener("click", copyHandoffPrompt);
    }

    function filterGlossary() {
      const query = ($("#glossary-search")?.value || "").trim().toLowerCase();
      $$(".glossary-item").forEach((item) => {
        item.hidden = Boolean(query) && !item.textContent.toLowerCase().includes(query);
      });
      updateGlossaryCount();
    }

    function updateGlossaryCount() {
      const visible = $$(".glossary-item").filter((item) => !item.hidden).length;
      const total = $$(".glossary-item").length;
      const note = $("#glossary-result-note");
      if (note) note.textContent = `显示 ${visible} / ${total} 个术语`;
    }

    function summaryText() {
      const project = atlas.project || {};
      const handoff = atlas.handoff || {};
      return [
        `项目：${project.name || "未命名"}`,
        `当前阶段：${project.stage || "未标注"}`,
        `目标：${handoff.goal || project.summary || "未记录"}`,
        `最后验证：${handoff.lastVerified || "未记录"}`,
        `必须保留：${safeArray(handoff.preserve).join("；") || "未记录"}`,
        `尚未验证：${safeArray(handoff.unverified).join("；") || "未记录"}`,
        `下一步：${safeArray(handoff.nextStep).join("；") || "未记录"}`
      ].join("\n");
    }

    async function writeClipboard(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    async function copyHandoffPrompt() {
      const text = atlas.handoff?.nextSessionPrompt || summaryText();
      try {
        await writeClipboard(text);
        const button = $("#copy-prompt-inline");
        if (button) button.textContent = "已复制";
      } catch {
        window.alert("没有取得剪贴板权限，请手动选择交接说明复制。");
      }
    }

    function bindNavigation() {
      const buttons = $$(".nav-button");
      buttons.forEach((button, index) => {
        button.addEventListener("click", () => {
          renderView(button.dataset.view);
          $("#main-content").focus({ preventScroll: true });
        });
        button.addEventListener("keydown", (event) => {
          if (!["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          let next = index;
          if (event.key === "ArrowDown" || event.key === "ArrowRight") next = (index + 1) % buttons.length;
          if (event.key === "ArrowUp" || event.key === "ArrowLeft") next = (index - 1 + buttons.length) % buttons.length;
          if (event.key === "Home") next = 0;
          if (event.key === "End") next = buttons.length - 1;
          buttons[next].focus();
        });
      });
    }

    function isVisible(element) {
      const style = window.getComputedStyle(element);
      const rect = element.getBoundingClientRect();
      return style.display !== "none"
        && style.visibility !== "hidden"
        && Number(style.opacity) !== 0
        && rect.width > 0
        && rect.height > 0;
    }

    function hasTextContent(element) {
      return Array.from(element.childNodes).some(
        (node) => node.nodeType === Node.TEXT_NODE && Boolean(node.textContent.trim())
      );
    }

    function clipAncestor(element) {
      let parent = element.parentElement;
      while (parent && parent !== document.body) {
        const style = window.getComputedStyle(parent);
        if (["hidden", "clip"].includes(style.overflowX)
          || ["hidden", "clip"].includes(style.overflowY)) {
          return parent;
        }
        parent = parent.parentElement;
      }
      return null;
    }

    function elementPath(element) {
      const parts = [];
      let current = element;
      while (current && current !== document.body && parts.length < 4) {
        const label = current.id
          ? `#${current.id}`
          : current.classList?.length
            ? `.${Array.from(current.classList).slice(0, 2).join(".")}`
            : current.tagName.toLowerCase();
        parts.unshift(label);
        current = current.parentElement;
      }
      return parts.join(" > ");
    }

    async function runLayoutAudit() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("audit") !== "1") return;

      if (document.fonts?.ready) await document.fonts.ready;
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

      const controls = $$("button, input, select, summary, a").filter(isVisible);
      const textElements = $$("body *").filter((element) => isVisible(element) && hasTextContent(element));
      const overflowingText = [];
      const clippedText = [];
      const undersizedControls = [];

      for (const element of textElements) {
        if (element.scrollWidth > element.clientWidth + 1 || element.scrollHeight > element.clientHeight + 1) {
          const style = window.getComputedStyle(element);
          if (["hidden", "clip"].includes(style.overflowX) || ["hidden", "clip"].includes(style.overflowY)) {
            overflowingText.push({
              path: elementPath(element),
              client: [element.clientWidth, element.clientHeight],
              scroll: [element.scrollWidth, element.scrollHeight]
            });
          }
        }

        const ancestor = clipAncestor(element);
        if (ancestor) {
          const rect = element.getBoundingClientRect();
          const clip = ancestor.getBoundingClientRect();
          if (rect.left < clip.left - 1 || rect.right > clip.right + 1
            || rect.top < clip.top - 1 || rect.bottom > clip.bottom + 1) {
            clippedText.push({ path: elementPath(element), clip: elementPath(ancestor) });
          }
        }
      }

      for (const control of controls) {
        const rect = control.getBoundingClientRect();
        if (rect.width < 24 || rect.height < 24) {
          undersizedControls.push({
            path: elementPath(control),
            size: [Math.round(rect.width), Math.round(rect.height)]
          });
        }
      }

      const watch = $$("button, input, select, summary, .page-card, .feature-card, .change-card, .comparison-block").filter(isVisible);
      const before = watch.map((element) => {
        const rect = element.getBoundingClientRect();
        return [rect.x, rect.y, rect.width, rect.height];
      });
      await new Promise((resolve) => window.setTimeout(resolve, 550));
      const unstable = [];
      watch.forEach((element, index) => {
        if (!element.isConnected || !isVisible(element)) return;
        const rect = element.getBoundingClientRect();
        const old = before[index];
        if (Math.abs(rect.x - old[0]) > 1
          || Math.abs(rect.y - old[1]) > 1
          || Math.abs(rect.width - old[2]) > 1
          || Math.abs(rect.height - old[3]) > 1) {
          unstable.push(elementPath(element));
        }
      });

      const result = {
        view: activeView,
        width: window.innerWidth,
        textElements: textElements.length,
        controls: controls.length,
        pageCards: $$(".page-card").length,
        comparisonBlocks: $$(".comparison-block").length,
        pageHorizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
        overflowingText,
        clippedText,
        undersizedControls,
        unstable
      };
      document.body.dataset.atlasAudit = JSON.stringify(result);
    }

    function bindZoom() {
      $$("[data-zoom]").forEach((button) => {
        button.addEventListener("click", () => {
          const delta = Number(button.dataset.zoom);
          zoom = delta === 0 ? 100 : Math.min(150, Math.max(70, zoom + delta));
          $("#zoom-surface").style.zoom = String(zoom / 100);
          button.blur();
        });
      });
    }

    $("#copy-summary")?.addEventListener("click", async () => {
      try {
        await writeClipboard(summaryText());
        $("#copy-summary").textContent = "已复制摘要";
      } catch {
        window.alert("没有取得剪贴板权限，请手动复制页面中的交接说明。");
      }
    });

    renderProjectChrome();
    bindNavigation();
    bindZoom();
    const requestedView = new URLSearchParams(window.location.search).get("view");
    renderView(VIEW_META[requestedView] ? requestedView : "overview");
  </script>
</body>
</html>
